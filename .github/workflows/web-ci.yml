name: Web CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "supabase/**"
      - "scripts/validate-migration-history*.mjs"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "supabase/**"
      - "scripts/validate-migration-history*.mjs"
      - ".github/workflows/web-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Validate recorded migration history
        working-directory: .
        run: |
          node scripts/validate-migration-history.mjs
          node --test scripts/validate-migration-history.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
          CURATIA_BOOTSTRAP_OWNER_EMAIL: owner@example.com
        run: npm run build
