<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="curatia-content-engine-title curatia-content-engine-desc" id="architecture-root"><title id="curatia-content-engine-title">Curatia | Editorial decisions with governance</title><desc id="curatia-content-engine-desc">CURRENT WEB APPLICATION. GOVERNED CONTENT OPERATIONS. Next.js interface: Login, onboarding, and Trend Radar. Authentication and roles: Workspace ownership and write gates. Supabase: Canonical application data and state. Editorial sources and skills: Portable intelligence and instructions. Human review: Approval remains explicit. Publishing integrations: Separately configured and verified. Incremental alpha. The lower lane is an operating model, not proof every publishing channel is implemented.</desc>
