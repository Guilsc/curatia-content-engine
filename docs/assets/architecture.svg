<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="curatia-title curatia-desc">
  <title id="curatia-title">Editorial work with an approval boundary</title>
  <desc id="curatia-desc">Authorized source material enters the Next.js editorial workspace. Human review is required before treating an output as approved. Supabase provides authentication and workspace storage; reusable skills provide guidance, not independent execution or publishing authority.</desc>
  <defs>
    <marker id="curatia-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8Z" fill="#bcc6d3"/>
    </marker>
    <marker id="curatia-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8Z" fill="#86c7a4"/>
    </marker>
  </defs>
  <rect width="960" height="570" rx="12" fill="#101722"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <path d="M222 246 H270" fill="none" stroke="#bcc6d3" stroke-width="1.8" marker-end="url(#curatia-arrow)"/>
    <path d="M456 246 H504" fill="none" stroke="#bcc6d3" stroke-width="1.8" marker-end="url(#curatia-arrow)"/>
    <path d="M690 246 H738" fill="none" stroke="#bcc6d3" stroke-width="1.8" marker-end="url(#curatia-arrow)"/>
    <path d="M363 296 V396" fill="none" stroke="#bcc6d3" stroke-width="1.8" marker-end="url(#curatia-arrow)"/>
    <rect x="297.6" y="335" width="130.79999999999998" height="25" rx="3" fill="#101722"/>
    <text x="363" y="353" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">auth + storage</text>
    <path d="M641 396 V344 Q641 336 633 336 H511 Q503 336 503 328 V296" fill="none" stroke="#bcc6d3" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#curatia-arrow)"/>
    <rect x="531.2" y="335" width="81.6" height="25" rx="3" fill="#101722"/>
    <text x="572" y="353" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">guidance</text>
    <text x="36" y="40" font-size="12" fill="#bcc6d3" text-anchor="start" font-weight="400" letter-spacing="1.8">CURATIA CONTENT ENGINE</text>
    <text x="36" y="80" font-size="29" fill="#f3f1e9" text-anchor="start" font-weight="600" letter-spacing="0">Editorial work with an approval boundary</text>
    <text x="36" y="110" font-size="17" fill="#bcc6d3" text-anchor="start" font-weight="400" letter-spacing="0">Application, persistence, and reusable guidance have distinct owners</text>
    <g data-node-id="sources">
      <rect data-role="bounds" x="36" y="196" width="186" height="100" rx="9" fill="#1a2636" stroke="#bcc6d3" stroke-width="1"/>
      <text x="129.0" y="227" font-size="20" fill="#f3f1e9" text-anchor="middle" font-weight="600" letter-spacing="0">Sources</text>
      <text x="129.0" y="254" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">Authorized material</text>
    </g>
    <g data-node-id="app">
      <rect data-role="bounds" x="270" y="196" width="186" height="100" rx="9" fill="#1a2636" stroke="#bcc6d3" stroke-width="1"/>
      <text x="363.0" y="227" font-size="20" fill="#f3f1e9" text-anchor="middle" font-weight="600" letter-spacing="0">Next.js app</text>
      <text x="363.0" y="254" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">app/</text>
    </g>
    <g data-node-id="review">
      <rect data-role="bounds" x="504" y="196" width="186" height="100" rx="9" fill="#1a2636" stroke="#86c7a4" stroke-width="2"/>
      <text x="597.0" y="227" font-size="20" fill="#f3f1e9" text-anchor="middle" font-weight="600" letter-spacing="0">Human review</text>
      <text x="597.0" y="254" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">Edit + verify</text>
    </g>
    <g data-node-id="output">
      <rect data-role="bounds" x="738" y="196" width="186" height="100" rx="9" fill="#1a2636" stroke="#bcc6d3" stroke-width="1"/>
      <text x="831.0" y="227" font-size="20" fill="#f3f1e9" text-anchor="middle" font-weight="600" letter-spacing="0">Approved</text>
      <text x="831.0" y="254" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">Result + next action</text>
    </g>
    <g data-node-id="supabase">
      <rect data-role="bounds" x="248" y="396" width="230" height="102" rx="9" fill="#1a2636" stroke="#bcc6d3" stroke-width="1"/>
      <text x="363.0" y="427" font-size="20" fill="#f3f1e9" text-anchor="middle" font-weight="600" letter-spacing="0">Supabase</text>
      <text x="363.0" y="454" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">Workspace data + auth</text>
      <text x="363.0" y="477" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">Secrets stay server-side</text>
    </g>
    <g data-node-id="skills">
      <rect data-role="bounds" x="526" y="396" width="230" height="102" rx="9" fill="#1a2636" stroke="#bcc6d3" stroke-width="1"/>
      <text x="641.0" y="427" font-size="20" fill="#f3f1e9" text-anchor="middle" font-weight="600" letter-spacing="0">Reusable skills</text>
      <text x="641.0" y="454" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">skills/</text>
      <text x="641.0" y="477" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">Host-owned tools</text>
    </g>
    <text x="36" y="542" font-size="15" fill="#bcc6d3" text-anchor="start" font-weight="400" letter-spacing="0">The repository does not grant autonomous publication or production access.</text>
  </g>
</svg>
